emplate-columns:repeat(2,minmax(0,1fr));gap:0 12px}.form-grid .full{grid-column:1/-1}.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12px}.empty-icon{font-size:24px;margin-bottom:7px}.stat-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eef0f3;font-size:12px}.stat-line:last-child{border:0}.progress{height:7px;border-radius:99px;background:#eef1f5;overflow:hidden;margin-top:7px}.progress span{height:100%;display:block;background:var(--teal);border-radius:99px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#d9eeec,transparent 35%),linear-gradient(135deg,#f2f5f9,#eaf0f6)}.login-card{width:min(540px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px}.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:20px}.login-logo .brand-mark{width:46px;height:46px}.login-card h1{margin:0 0 5px;font-size:22px}.login-card p{margin:0 0 18px;color:var(--muted);font-size:12px}.setup-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-backdrop{position:fixed;inset:0;background:#10182888;z-index:100;display:grid;place-items:center;padding:18px}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 22px 60px #0003}.modal-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{font-size:15px;margin:0}.modal-body{padding:20px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}.icon-btn{border:0;background:transparent;font-size:20px;color:#667085}.line-items{display:grid;gap:8px}.line-item{display:grid;grid-template-columns:1.4fr .55fr .7fr .8fr .75fr .75fr 32px;gap:7px;align-items:end;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:10px}.line-item input,.line-item select{width:100%;min-width:0;border:1px solid #d8dde5;border-radius:7px;padding:8px;font-size:11px}.line-item label{font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800;display:block;margin-bottom:4px}.totals{margin-left:auto;width:min(340px,100%);padding:12px 0}.totals .stat-line{padding:6px 0}.totals .grand{font-size:16px;font-weight:900;border-top:1px solid var(--line);margin-top:7px;padding-top:11px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setting-card{border:1px solid var(--line);border-radius:12px;padding:16px}.setting-card h3{font-size:13px;margin:0 0 7px}.setting-card p{font-size:11px;color:var(--muted);line-height:1.55;margin:0 0 12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;background:#f2f4f7;border-radius:6px;padding:2px 5px}.sync-footer{font-size:10px;color:var(--muted);margin-top:10px}.toast{position:fixed;bottom:18px;right:18px;z-index:200;background:#172b4d;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;max-width:360px}.toast.error{background:#8e2828}.print-only{display:none}

@media(max-width:720px){.app-shell{display:block}.sidebar{position:sticky;top:0;z-index:30;padding:10px;gap:9px}.brand{padding:0 4px}.brand-mark{width:32px;height:32px}.nav-label,.sidebar-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px;font-size:11px}.nav-ico{display:none}.topbar{height:60px;padding:0 14px}.status-pill{display:none}.page{padding:18px 13px 34px}.page-head{align-items:flex-start;flex-direction:column}.kpis{gap:9px}.kpi{padding:13px}.kpi-value{font-size:20px}.setup-split,.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.line-item{grid-template-columns:1fr 1fr}.line-item .remove-line{grid-column:auto}.login-card{padding:22px}.top-actions .user-chip{display:none}}

<body>
<div id="root"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>
<script>
(()=>{
'use strict';
const APP='Shreeji Marketing';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>Number(v||0);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-IN'):'—';
const uid=()=>crypto.randomUUID?crypto.randomUUID():('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)}));
let rootHandle=null,dirs={},events=[],state=null,users=[],user=null,activePage='dashboard',lastSync=null,deviceId=uid(),lockHeld=false;
let driveToken=null,driveTokenExpires=0,driveClientId='',driveAccountEmail='',driveAccountName='';
try{deviceId=localStorage.getItem('sm_device_id')||deviceId;localStorage.setItem('sm_device_id',deviceId)}catch(e){console.warn('Device id will be temporary in this browser profile',e)}
const DRIVE_API='https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD='https://www.googleapis.com/upload/drive/v3';
const FOLDER_MIME='application/vnd.google-apps.folder';
const saved=(k)=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const persist=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){console.warn('Browser settings could not be saved',e)}};
function toast(msg,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=msg;$('#toast-root').append(el);setTimeout(()=>el.remove(),4200)}
function errText(e){return e?.message||String(e)}
function waitForGoogle(){return new Promise((resolve,reject)=>{const start=Date.now();const tick=()=>{if(window.google?.accounts?.oauth2)return resolve();if(Date.now()-start>12000)return reject(new Error('Google authorization library did not load. Check your internet connection and reload the app.'));setTimeout(tick,120)};tick()})}
function requestDriveToken(clientId,prompt='select_account consent'){
 return new Promise(async(resolve,reject)=>{try{await waitForGoogle();const client=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/drive',include_granted_scopes:true,prompt,callback:resp=>{if(resp?.error){reject(new Error(resp.error_description||resp.error));return}driveToken=resp.access_token;driveTokenExpires=Date.now()+(Number(resp.expires_in||3600)*1000);resolve(resp)},error_callback:err=>reject(new Error(err?.message||'Google sign-in popup was closed or blocked.'))});client.requestAccessToken()}catch(e){reject(e)}})
}
async function driveFetch(url,options={}){
 if(!driveToken||Date.now()>driveTokenExpires-30000)throw new Error('Your Google Drive session has expired. Click “Reconnect Drive” and sign in again.');
 const headers=new Headers(options.headers||{});headers.set('Authorization','Bearer '+driveToken);
 const res=await fetch(url.startsWith('http')?url:DRIVE_API+url,{...options,headers});
 if(res.status===401){driveToken=null;driveTokenExpires=0;throw new Error('Google Drive authorization expired. Click “Reconnect Drive” and sign in again.')}
 if(!res.ok){let detail='';try{const x=await res.json();detail=x.error?.message||''}catch(e){}throw new Error(`Google Drive error ${res.status}${detail?': '+detail:''}`)}
 return res;
}
async function driveJson(url,options={}){const res=await driveFetch(url,options);if(res.status===204)return null;return res.json()}
function qEscape(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function driveList(query){let pageToken=null,out=[];do{const params=new URLSearchParams({q:query,pageSize:'1000',spaces:'drive',supportsAllDrives:'true',includeItemsFromAllDrives:'true',fields:'nextPageToken,files(id,name,mimeType,parents,modifiedTime,webViewLink,owners(displayName,emailAddress),capabilities(canEdit))'});if(pageToken)params.set('pageToken',pageToken);const data=await driveJson('/files?'+params.toString());out.push(...(data.files||[]));pageToken=data.nextPageToken||null}while(pageToken);return out}
async function driveChild(parentId,name,mimeType=null){let q=`'${parentId}' in parents and name='${qEscape(name)}' and trashed=false`;if(mimeType)q+=` and mimeType='${mimeType}'`;const found=await driveList(q);return found[0]||null}
async function driveCreateMeta(name,mimeType,parentId){const body={name,mimeType};if(parentId)body.parents=[parentId];return driveJson('/files?fields=id,name,mimeType,parents,webViewLink',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
class DriveFileHandle{
 constructor(id,name){this.id=id;this.name=name}
 async getFile(){const res=await driveFetch(`${DRIVE_API}/files/${encodeURIComponent(this.id)}?alt=media`);const value=await res.text();return{text:async()=>value}}
 async createWritable(){let value='';return{write:async(v)=>{value=typeof v==='string'?v:await v.text()},close:async()=>{await driveFetch(`${DRIVE_UPLOAD}/files/${encodeURIComponent(this.id)}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json; charset=UTF-8'},body:value})}}}
}
class DriveDirectoryHandle{
 constructor(id,name){this.id=id;this.name=name}
 async getDirectoryHandle(name,{create=false}={}){let f=await driveChild(this.id,name,FOLDER_MIME);if(!f&&create)f=await driveCreateMeta(name,FOLDER_MIME,this.id);if(!f){const e=new Error(`Folder not found: ${name}`);e.name='NotFoundError';throw e}return new DriveDirectoryHandle(f.id,f.name)}
 async getFileHandle(name,{create=false}={}){let f=await driveChild(this.id,name);if(!f&&create)f=await driveCreateMeta(name,'application/json',this.id);if(!f){const e=new Error(`File not found: ${name}`);e.name='NotFoundError';throw e}if(f.mimeType===FOLDER_MIME)throw new Error(`${name} is a folder, not a file.`);return new DriveFileHandle(f.id,f.name)}
 async *entries(){const files=await driveList(`'${this.id}' in parents and trashed=false`);for(const f of files)yield[f.name,f.mimeType===FOLDER_MIME?new DriveDirectoryHandle(f.id,f.name):new DriveFileHandle(f.id,f.name)]}
 async removeEntry(name){const f=await driveChild(this.id,name);if(!f)return;await driveFetch(`${DRIVE_API}/files/${encodeURIComponent(f.id)}?supportsAllDrives=true`,{method:'DELETE'})}
}
async function getDriveAccount(){const data=await driveJson('/about?fields=user(displayName,emailAddress)');driveAccountEmail=data.user?.emailAddress||'';driveAccountName=data.user?.displayName||''}
async function authorizeDrive(clientId){driveClientId=clientId.trim();if(!driveClientId)throw new Error('Enter your Google OAuth Client ID first.');persist('sm_google_client_id',driveClientId);await requestDriveToken(driveClientId);await getDriveAccount()}
async function attachRoot(h){rootHandle=h;dirs.events=await h.getDirectoryHandle('events',{create:true});dirs.backups=await h.getDirectoryHandle('backups',{create:true});dirs.reports=await h.getDirectoryHandle('reports',{create:true});dirs.config=await h.getDirectoryHandle('config',{create:true});dirs.locks=await h.getDirectoryHandle('locks',{create:true});lastSync=new Date();}
async function connectExisting(){try{if(!$('#drive-scope-ok')?.checked)throw new Error('Please read and accept the Google Drive permission notice before connecting.');const clientId=$('#google-client-id')?.value||saved('sm_google_client_id');driveClientId=clientId.trim();await authorizeDrive(driveClientId);const folderId=($('#drive-folder-id')?.value||saved('sm_drive_folder_id')).trim();let folder=null;if(folderId){folder=await driveJson(`/files/${encodeURIComponent(folderId)}?fields=id,name,mimeType,webViewLink,capabilities(canEdit),owners(displayName,emailAddress),shared`);if(folder.mimeType!==FOLDER_MIME)throw new Error('The supplied Drive ID is not a folder.')}else{const folders=await driveList(`name='Shreeji Marketing Data' and mimeType='${FOLDER_MIME}' and trashed=false`);if(folders.length===0)throw new Error('No “Shreeji Marketing Data” folder is visible in this Google account. On computer 1, create the folder and share it with this Google account, then retry.');if(folders.length>1){const choices=folders.map((f,i)=>`${i+1}. ${f.name} — ${f.id}`).join('\n');const pick=Number(prompt('More than one matching folder was found. Enter the number of the shared business folder:\n'+choices));if(!pick||!folders[pick-1])throw new Error('Folder selection cancelled.');folder=folders[pick-1]}else folder=folders[0]}
 if(folder.capabilities&&!folder.capabilities.canEdit)throw new Error('You have view-only access. Share the folder with this Google account as Editor.');persist('sm_drive_folder_id',folder.id);persist('sm_drive_folder_name',folder.name);rootHandle=new DriveDirectoryHandle(folder.id,folder.name);await attachRoot(rootHandle);showAuth();toast(`Connected to Google Drive${driveAccountEmail?' as '+driveAccountEmail:''}.`)}catch(e){toast(errText(e),true)}}
async function createDriveFolder(){try{if(!$('#drive-scope-ok')?.checked)throw new Error('Please read and accept the Google Drive permission notice before connecting.');await authorizeDrive($('#google-client-id')?.value||saved('sm_google_client_id'));const existing=await driveList(`name='Shreeji Marketing Data' and mimeType='${FOLDER_MIME}' and trashed=false`);if(existing.length)throw new Error('A folder named “Shreeji Marketing Data” already exists. Use “Connect to existing shared folder” instead; do not create a second data folder.');const f=await driveCreateMeta('Shreeji Marketing Data',FOLDER_MIME,null);persist('sm_drive_folder_id',f.id);persist('sm_drive_folder_name',f.name);rootHandle=new DriveDirectoryHandle(f.id,f.name);await attachRoot(rootHandle);showAuth();toast('Data folder created in Google Drive. Share it with the second Google account from Settings or Google Drive.') }catch(e){toast(errText(e),true)}}
async function reconnectDrive(){try{await authorizeDrive(saved('sm_google_client_id'));const id=saved('sm_drive_folder_id');if(!id)throw new Error('No saved Shreeji data folder. Reconnect it from the login screen.');const f=await driveJson(`/files/${encodeURIComponent(id)}?fields=id,name,mimeType,capabilities(canEdit)`);if(f.mimeType!==FOLDER_MIME)throw new Error('Saved Google Drive item is no longer a folder.');rootHandle=new DriveDirectoryHandle(f.id,f.name);await attachRoot(rootHandle);await refreshState();renderPage();updateSyncLabel();toast('Google Drive reconnected successfully.')}catch(e){toast(errText(e),true)}}
async function init(){driveClientId=saved('sm_google_client_id');renderConnect()}

async function derivePass(pass,salt){const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:180000,hash:'SHA-256'},key,256);return btoa(String.fromCharCode(...new Uint8Array(bits)))}
function randomSalt(){const b=crypto.getRandomValues(new Uint8Array(16));return btoa(String.fromCharCode(...b))}

function renderLogin(){ $('#root').innerHTML=`<div class="login-wrap"><div class="login-card"><div class="login-logo"><div class="brand-mark">SM</div><div><div class="brand-name" style="color:var(--navy)">SHREEJI MARKETING</div><div class="brand-sub" style="color:var(--muted)">Tiles Management System</div></div></div><h1>Sign in</h1><p>Only the configured Administrator and Staff accounts can access this system.</p><div class="alert blue">Google Drive is connected online. Use <b>Sync now</b> to re-read the latest shared files from Google Drive.</div><form id="login-form"><div class="field"><label>Username</label><input name="username" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;padding:13px">Sign in</button></form><div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><button class="btn small" id="reconnect">Change Drive folder</button><button class="btn small" id="signin-sync">Sync now</button></div><div class="sync-footer">Storage: online Google Drive · Two app accounts maximum · ${esc(driveAccountEmail||'Google account')}</div></div></div>`;$('#login-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),u=users.find(x=>x.username.toLowerCase()===String(f.get('username')).trim().toLowerCase());if(!u)return toast('Username or password is incorrect.',true);try{const h=await derivePass(String(f.get('password')),u.salt);if(h!==u.hash)return toast('Username or password is incorrect.',true);user=u;await registerDevice();await refreshState();await maybeAutoBackup();renderApp()}catch(err){user=null;toast(errText(err),true)}};$('#reconnect').onclick=()=>renderConnect();$('#signin-sync').onclick=async()=>{try{await permission();await refreshState();toast('Online Google Drive refreshed.')}catch(e){toast(errText(e),true)}};}
async function listJsonEvents(){await permission();const arr=[];for await(const [name,handle] of dirs.events.entries()){if(!name.endsWith('.json'))continue;try{const txt=await(await handle.getFile()).text();const ev=JSON.parse(txt);if(ev&&ev.id&&ev.type)arr.push(ev)}catch(e){console.warn('Unreadable event',name,e)}}arr.sort((a,b)=>a.ts.localeCompare(b.ts)||a.id.localeCompare(b.id));return arr}
async function refreshState(){events=await listJsonEvents();state=derive(events);lastSync=new Date();}
function derive(evts){const s={designs:{},batches:{},dealers:{},customers:{},sales:{},payments:[],returns:[],damages:[],movements:[],audit:evts,conflicts:[]};
for(const ev of evts){const p=ev.payload||{};switch(ev.type){case'DESIGN_SAVE':s.designs[p.id]={...p};break;case'DESIGN_ARCHIVE':if(s.designs[p.id])s.designs[p.id].status='Archived';break;case'DESIGN_DELETE':if(s.designs[p.id])s.designs[p.id].deleted=true;break;case'DEALER_SAVE':s.dealers[p.id]={...p};break;case'CUSTOMER_SAVE':s.customers[p.id]={...p};break;case'STOCK_IN':{let b=s.batches[p.batchId];if(!b)b=s.batches[p.batchId]={id:p.batchId,designId:p.designId,batchNo:p.batchNo,size:p.size,received:0,available:0,date:p.date,createdAt:ev.ts,supplier:p.supplier,reference:p.reference};b.received+=num(p.qty);b.available+=num(p.qty);s.movements.push({type:'Stock In',date:p.date,designId:p.designId,batchNo:p.batchNo,qty:num(p.qty),user:ev.userName||ev.user});break;}case'STOCK_OUT':{const b=s.batches[p.batchId];if(b){b.available-=num(p.qty);if(b.available<0)s.conflicts.push({designId:b.designId,batchId:b.id,reason:'Stock below zero'});}s.movements.push({type:'Stock Out',date:p.date,designId:p.designId,batchNo:b?.batchNo||'',qty:-num(p.qty),user:ev.userName||ev.user,reason:p.reason});break;}case'SALE_CREATE':{s.sales[p.id]={...p,deleted:false,returns:[]};for(const line of p.lines||[])for(const a of line.allocations||[]){const b=s.batches[a.batchId];if(b){b.available-=num(a.qty);if(b.available<0)s.conflicts.push({designId:b.designId,batchId:b.id,reason:'FIFO oversell detected'});}}s.movements.push({type:'Sale',date:p.date,designId:null,qty:-(p.totalBoxes||0),user:ev.userName||ev.user,ref:p.invoiceNo});break;}case'SALE_UPDATE':if(s.sales[p.saleId]&&!s.sales[p.saleId].deleted){s.sales[p.saleId]={...s.sales[p.saleId],...p.changes};}break;case'SALE_DELETE':{const sale=s.sales[p.saleId];if(sale&&!sale.deleted){for(const line of sale.lines||[])for(const a of line.allocations||[]){const b=s.batches[a.batchId];if(b)b.available+=num(a.qty);}sale.deleted=true;sale.deletedReason=p.reason;}break;}case'PAYMENT_ADD':s.payments.push({...p,eventId:ev.id,ts:ev.ts,user:ev.userName||ev.user});break;case'RETURN_ADD':{s.returns.push({...p,eventId:ev.id,ts:ev.ts});s.movements.push({type:'Customer Return',date:p.date,designId:p.designId,batchNo:(p.allocations||[]).map(a=>s.batches[a.batchId]?.batchNo||'').join(', '),qty:num(p.qty),user:ev.userName||ev.user,reason:p.reason});for(const a of p.allocations||[]){const b=s.batches[a.batchId];if(b)b.available+=num(a.qty);}const sale=s.sales[p.saleId];if(sale)sale.returns.push(p);break;}case'DAMAGE_ADD':{s.damages.push({...p,eventId:ev.id,ts:ev.ts});const b=s.batches[p.batchId];if(b){b.available-=num(p.qty);if(b.available<0)s.conflicts.push({designId:b.designId,batchId:b.id,reason:'Damage exceeds available stock'});}s.movements.push({type:'Damage',date:p.date,designId:p.designId,batchNo:b?.batchNo||'',qty:-num(p.qty),user:ev.userName||ev.user,reason:p.reason});break;}}
}
for(const sale of Object.values(s.sales)){if(sale.deleted)continue;sale.returnQty=(sale.returns||[]).reduce((n,r)=>n+num(r.qty),0);sale.returnValue=(sale.returns||[]).reduce((n,r)=>n+num(r.credit),0);}
return s;}
function allBatches(designId=null){return Object.values(state?.batches||{}).filter(b=>!designId||b.designId===designId)}
function availableForDesign(designId){return allBatches(designId).reduce((n,b)=>n+Math.max(0,b.available),0)}
function allSales(){return Object.values(state?.sales||{}).filter(s=>!s.deleted)}
function paymentsFor(refType,refId,invoiceId=null){return state.payments.filter(p=>(p.accountType===refType)&&(p.accountId===refId)&&(!invoiceId||p.invoiceId===invoiceId)).reduce((n,p)=>n+num(p.amount),0)}
function outstanding(accountType,id){const opening=accountType==='Dealer'?num(state.dealers[id]?.openingBalance):num(state.customers[id]?.openingBalance);const sales=allSales().filter(s=>s.accountType===accountType&&s.accountId===id).reduce((n,s)=>n+num(s.total)-num(s.returnValue),0);return opening+sales-paymentsFor(accountType,id)}
function designLabel(id){const d=state.designs[id];return d?`${d.name} · ${d.size}`:'Unknown design'}
function lowStock(){return Object.values(state.designs).filter(d=>!d.deleted&&d.status!=='Archived'&&d.status!=='Discontinued'&&availableForDesign(d.id)<num(d.minStock)).map(d=>({...d,available:availableForDesign(d.id)}))}
function newEvent(type,payload,previous=null){return{id:uid(),type,ts:new Date().toISOString(),user:user?.username||'system',userName:user?.name||'System',role:user?.role||'System',deviceId,payload,previous}}
async function getLockFiles(){const found=[];for await(const [name,h] of rootHandle.entries()){if(name.toLowerCase().startsWith('_shreeji_write_lock'))found.push({name,h})}return found}
async function acquireLock(){await permission();const files=await getLockFiles();if(files.length>1)throw new Error('Multiple Drive lock files were detected. Sync conflict: ask the Administrator to reconcile the lock files before entering stock or payment changes.');let lockHandle;if(files.length===1)lockHandle=files[0].h;else lockHandle=await rootHandle.getFileHandle('_SHREEJI_WRITE_LOCK.json',{create:true});let current=null;try{current=JSON.parse(await(await lockHandle.getFile()).text())}catch(e){}const now=Date.now();if(current&&current.expiresAt>now&&current.deviceId!==deviceId){throw new Error(`Another computer is processing a change (${current.userName||current.user||'another user'}). Wait for that operation to finish, then Sync Now.`)}const lock={deviceId,user:user?.username,userName:user?.name,startedAt:new Date().toISOString(),expiresAt:now+45000};const w=await lockHandle.createWritable();await w.write(JSON.stringify(lock));await w.close();const check=JSON.parse(await(await lockHandle.getFile()).text());if(check.deviceId!==deviceId)throw new Error('Could not acquire the shared write lock. Sync the Drive folder and retry.');lockHeld=true;return lockHandle}
async function releaseLock(handle){if(!handle)return;try{const w=await handle.createWritable();await w.write(JSON.stringify({deviceId,user:user?.username,userName:user?.name,releasedAt:new Date().toISOString(),expiresAt:0}));await w.close()}catch(e){console.warn('Lock release',e)}lockHeld=false}
function eventFingerprint(){return events.map(e=>e.id).sort().join('|')}
function validatePendingEvent(ev){const p=ev.payload||{};if(ev.type==='STOCK_OUT'||ev.type==='DAMAGE_ADD'){const b=state.batches[p.batchId];if(!b||num(p.qty)<=0||b.available<num(p.qty))throw new Error(`Stock changed before this entry could be saved. Current batch availability is ${b?.available??0} boxes. Press Sync now and retry.`)}
if(ev.type==='SALE_CREATE'){if(allSales().some(s=>s.invoiceNo.toLowerCase()===String(p.invoiceNo).toLowerCase()))throw new Error('This invoice number already exists. Refresh the register and choose another number.');const shadow=new Map();for(const line of p.lines||[]){let allocated=0;for(const a of line.allocations||[]){const b=state.batches[a.batchId];if(!b)throw new Error('A FIFO batch allocation no longer exists. Re-open the invoice.');const remain=shadow.has(a.batchId)?shadow.get(a.batchId):b.available;if(num(a.qty)<=0||remain<num(a.qty))throw new Error(`Stock in batch ${b.batchNo} changed before the sale was saved. Sync and re-create the invoice.`);shadow.set(a.batchId,remain-num(a.qty));allocated+=num(a.qty)}if(allocated!==num(line.qty))throw new Error('FIFO allocation quantity does not match the sale quantity.')}}
if(ev.type==='PAYMENT_ADD'&&p.reference&&state.payments.some(x=>x.accountId===p.accountId&&x.reference===p.reference))throw new Error('A payment with this account and reference already exists.');if(ev.type==='PAYMENT_ADD'&&p.invoiceId){const sale=state.sales[p.invoiceId];if(!sale||sale.deleted||sale.accountId!==p.accountId||sale.accountType!==p.accountType)throw new Error('The selected invoice is no longer available for this account.');const due=sale.total-sale.returnValue-paymentsFor(sale.accountType,sale.accountId,sale.id);if(num(p.amount)<=0||num(p.amount)>due+0.005)throw new Error(`Invoice balance changed. Current balance is ${money(due)}.`)}
if(ev.type==='RETURN_ADD'){const sale=state.sales[p.saleId],line=sale?.lines.find(l=>l.id===p.lineId);if(!sale||!line)throw new Error('Original sale item could not be found.');const already=state.returns.filter(r=>r.saleId===p.saleId&&r.lineId===p.lineId).reduce((n,r)=>n+num(r.qty),0);if(num(p.qty)<=0||already+num(p.qty)>line.qty)throw new Error('Return quantity changed; refresh and check the remaining boxes.');}
if(ev.type==='SALE_DELETE'){const sale=state.sales[p.saleId];if(!sale||sale.deleted)throw new Error('Invoice is no longer active.');if(state.payments.some(x=>x.invoiceId===p.saleId)||state.returns.some(x=>x.saleId===p.saleId))throw new Error('An invoice with payments or returns cannot be deleted.');}}
async function commitEvents(list,expectedFingerprint=null){const lock=await acquireLock();try{await refreshState();if(expectedFingerprint!==null&&eventFingerprint()!==expectedFingerprint)throw new Error('Another computer changed the Drive event files while this form was open. Sync and recreate this transaction before saving.');for(const ev of list){validatePendingEvent(ev);const f=`${ev.ts.replace(/[:.]/g,'-')}_${ev.id}.json`;await writeText(dirs.events,f,JSON.stringify(ev,null,2));await refreshState();}await refreshState();}finally{await releaseLock(lock)}if(events.length%50===0)await maybeAutoBackup()}
async function commit(type,payload,previous=null){const ev=newEvent(type,payload,previous);await commitEvents([ev]);return ev}
function allocateFifo(designId,qty,shadow=new Map()){let remaining=num(qty);const batches=allBatches(designId).filter(b=>(shadow.has(b.id)?shadow.get(b.id):b.available)>0).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt));const total=batches.reduce((n,b)=>n+(shadow.has(b.id)?shadow.get(b.id):b.available),0);if(total<remaining)throw new Error(`Insufficient stock for ${designLabel(designId)}. Available: ${total} boxes; requested: ${qty}.`);const allocations=[];for(const b of batches){if(remaining<=0)break;const avail=shadow.has(b.id)?shadow.get(b.id):b.available;const take=Math.min(remaining,avail);if(take>0){allocations.push({batchId:b.id,qty:take,batchNo:b.batchNo});shadow.set(b.id,avail-take);remaining-=take}}if(remaining>0)throw new Error('FIFO allocation could not be completed. Refresh inventory and retry.');return allocations}

$('#root').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">SM</div><div><div class="brand-name">SHREEJI MARKETING</div><div class="brand-sub">Tiles Management</div></div></div><div><div class="nav-label">BUSINESS</div><nav class="nav">${pages.slice(0,8).map(p=>navButton(p)).join('')}</nav></div><div><div class="nav-label">INSIGHTS & CONTROL</div><nav class="nav">${pages.slice(8).map(p=>navButton(p)).join('')}</nav></div><div class="sidebar-bottom">Google Drive online storage<br><span id="side-sync">Checking sync status…</span><br>Version 1.1 · Two accounts only</div></aside><main class="main"><header class="topbar"><div><div class="crumb">Shreeji Marketing / <span id="crumb">Dashboard</span></div><div class="page-title" id="top-title">Dashboard</div></div><div class="top-actions"><div class="status-pill"><span class="dot ok"></span><span>Google Drive online</span></div><button class="btn small" id="sync-btn">↻ Sync now</button><button class="btn small" id="reconnect-drive">Reconnect Drive</button><div class="user-chip"><div class="avatar">${esc(user.name.slice(0,1).toUpperCase())}</div><span>${esc(user.name)} · ${esc(user.role)}</span></div><button class="btn small" id="logout-btn">Log out</button></div></header><section class="page" id="page-content"></section></main></div>`;
$('#sync-btn').onclick=async()=>{try{await permission();await refreshState();renderPage();toast('Online Google Drive refreshed.')}catch(e){toast(errText(e),true)}};$('#reconnect-drive').onclick=reconnectDrive;$('#logout-btn').onclick=()=>{user=null;renderLogin()};renderPage();updateSyncLabel();if(window._shreejiRefreshTimer)clearInterval(window._shreejiRefreshTimer);window._shreejiRefreshTimer=setInterval(async()=>{if(!user||document.visibilityState!=='visible'||$('#modal-root').innerHTML.trim())return;try{const before=eventFingerprint();await refreshState();if(before!==eventFingerprint())renderPage();else updateSyncLabel()}catch(e){console.warn('Auto-refresh',e)}},15000);
}
function navButton(p){return`<button data-page="${p[0]}" class="${activePage===p[0]?'active':''}"><span class="nav-ico">${p[1]}</span>${p[2]}</button>`}
function updateSyncLabel(){const t=lastSync?lastSync.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'Not synced';const el=$('#side-sync');if(el)el.textContent='Online · last checked '+t;}
function renderPage(){const names={dashboard:'Dashboard',designs:'Design Catalogue',inventory:'Inventory',sales:'Sales',accounts:'Dealers & Customers',payments:'Payments',returns:'Customer Returns',damage:'Damaged Stock',reports:'Reports & Statements',audit:'Audit History',settings:'Settings & Backup'};$('#crumb').textContent=names[activePage];$('#top-title').textContent=names[activePage];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));const f={dashboard:renderDashboard,designs:renderDesigns,inventory:renderInventory,sales:renderSales,accounts:renderAccounts,payments:renderPayments,returns:renderReturns,damage:renderDamage,reports:renderReports,audit:renderAudit,settings:renderSettings}[activePage];$('#page-content').innerHTML=f();bindPage();updateSyncLabel()}
function pageHead(title,sub,actions=''){return`<div class="page-head"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="toolbar">${actions}</div></div>`}
function panel(title,body,action=''){return`<div class="panel"><div class="panel-head"><div class="panel-title">${title}</div>${action}</div><div class="panel-body">${body}</div></div>`}
function empty(msg){return`<div class="empty"><div class="empty-icon">◌</div>${msg}</div>`}
function renderDashboard(){const sales=allSales(),todaySales=sales.filter(s=>s.date===today()).reduce((n,s)=>n+s.total,0),ws=sales.filter(s=>s.accountType==='Dealer').reduce((n,s)=>n+s.total,0),rs=sales.filter(s=>s.accountType==='Customer').reduce((n,s)=>n+s.total,0),stock=Object.values(state.batches).reduce((n,b)=>n+Math.max(0,b.available),0),dealerDue=Object.keys(state.dealers).reduce((n,id)=>n+outstanding('Dealer',id),0),customerDue=Object.keys(state.customers).reduce((n,id)=>n+outstanding('Customer',id),0),damaged=state.damages.reduce((n,d)=>n+num(d.qty),0),low=lowStock();const sorted=Object.values(state.designs).map(d=>({...d,available:availableForDesign(d.id),sold:sales.reduce((n,s)=>n+(s.lines||[]).filter(l=>l.designId===d.id).reduce((a,l)=>a+num(l.qty),0),0)-state.returns.filter(r=>r.designId===d.id).reduce((n,r)=>n+num(r.qty),0)})).sort((a,b)=>b.sold-a.sold);const recent=sales.slice().sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,5);const mov=state.movements.slice(-6).reverse();return`${pageHead('Business overview','A live view of stock, sales, dealer balances and daily operations',`<button class="btn primary" data-action="new-sale">＋ New sale</button><button class="btn" data-action="stock-in">＋ Stock in</button>`)}<div class="alert">Google Drive stores the business files online, but this file-based workflow is not a transactional database. Only one computer should process stock-changing transactions at a time. Press <b>Sync now</b> before starting work on the other computer.</div>${state.conflicts.length?`<div class="alert red"><b>Inventory conflict detected.</b> One or more batch balances are below zero. New sales for affected items must stop until the Administrator reconciles the records. Open Settings → Diagnostics.</div>`:''}<div class="grid kpis"><div class="kpi accent"><div class="kpi-label">AVAILABLE STOCK</div><div class="kpi-value">${stock.toLocaleString('en-IN')} <small style="font-size:12px;color:var(--muted)">boxes</small></div><div class="kpi-foot">Combined showroom and warehouse stock</div></div><div class="kpi"><div class="kpi-label">TODAY'S SALES</div><div class="kpi-value">${money(todaySales)}</div><div class="kpi-foot">GST and non-GST bills</div></div><div class="kpi"><div class="kpi-label">COMBINED SALES</div><div class="kpi-value">${money(ws+rs)}</div><div class="kpi-foot">Wholesale ${money(ws)} · Retail ${money(rs)}</div></div><div class="kpi"><div class="kpi-label">TOTAL OUTSTANDING</div><div class="kpi-value">${money(dealerDue+customerDue)}</div><div class="kpi-foot">Dealers ${money(dealerDue)} · Customers ${money(customerDue)}</div></div></div><div class="grid two-col"><div class="grid">${panel('Low stock alerts',low.length?`<div class="table-wrap"><table><thead><tr><th>Design</th><th>Size</th><th>Available</th><th>Minimum</th></tr></thead><tbody>${low.map(d=>`<tr><td class="strong">${esc(d.name)}</td><td>${esc(d.size)}</td><td><span class="badge red">${d.available} boxes</span></td><td>${num(d.minStock)}</td></tr>`).join('')}</tbody></table></div>`:empty('No low-stock designs right now.'),`<span class="badge ${low.length?'red':'green'}">${low.length} items</span>`)}${panel('Recent sales',recent.length?`<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Type</th><th>Amount</th></tr></thead><tbody>${recent.map(s=>`<tr><td class="strong">${esc(s.invoiceNo)}</td><td>${fmtDate(s.date)}</td><td>${s.accountType==='Dealer'?'Wholesale':'Retail'}</td><td>${money(s.total)}</td></tr>`).join('')}</tbody></table></div>`:empty('Sales will appear here after the first invoice.'),'<button class="btn small" data-page="sales">View all</button>')}</div><div class="grid">${panel('Fast-moving designs',sorted.filter(d=>d.sold>0).slice(0,5).length?sorted.filter(d=>d.sold>0).slice(0,5).map((d,i)=>`<div class="stat-line"><span>${i+1}. ${esc(d.name)} <span class="muted">${esc(d.size)}</span></span><b>${d.sold} boxes</b></div>`).join(''):empty('Sales history will build this ranking.'),'Last sales history')}${panel('Recent stock movements',mov.length?mov.map(m=>`<div class="stat-line"><span>${esc(m.type)} · ${esc(m.batchNo||m.ref||'')}</span><b class="${m.qty<0?'':'muted'}">${m.qty>0?'+':''}${m.qty} boxes</b></div>`).join(''):empty('No stock movements recorded yet.'),'Latest activity')}<div class="panel"><div class="panel-body"><div class="stat-line"><span>Damaged boxes recorded</span><b class="badge amber">${damaged}</b></div><div class="stat-line"><span>Active dealers</span><b>${Object.values(state.dealers).length}</b></div><div class="stat-line"><span>Retail customers</span><b>${Object.values(state.customers).length}</b></div></div></div></div></div>`}
function renderDesigns(){const ds=Object.values(state.designs).filter(d=>!d.deleted);return`${pageHead('Design catalogue','Manage tile designs, sizes, coverage and minimum stock levels',`<button class="btn primary" data-action="add-design">＋ Add design</button>`)}<div class="toolbar" style="margin-bottom:13px"><input class="search" id="design-search" placeholder="Search design, brand or size…"><select id="design-status" class="search" style="min-width:140px"><option value="All">All statuses</option><option>Active</option><option>Discontinued</option><option>Archived</option></select></div>${panel('Designs and sizes',ds.length?`<div class="table-wrap"><table><thead><tr><th>Design</th><th>Brand</th><th>Tile size</th><th>Sq ft / box</th><th>Pieces / box</th><th>Min stock</th><th>Available boxes</th><th>Status</th><th></th></tr></thead><tbody id="design-rows">${ds.map(d=>designRow(d)).join('')}</tbody></table></div>`:empty('No designs yet. Add your first tile design and size.'))}`}
function designRow(d){return`<tr data-search="${esc((d.name+' '+d.brand+' '+d.size).toLowerCase())}" data-status="${esc(d.status)}"><td class="strong">${esc(d.name)}</td><td>${esc(d.brand||'—')}</td><td>${esc(d.size)}</td><td>${num(d.coverage).toFixed(2)}</td><td>${d.pieces||'—'}</td><td>${num(d.minStock)}</td><td><b class="${availableForDesign(d.id)<num(d.minStock)?'red':''}">${availableForDesign(d.id)}</b></td><td><span class="badge ${d.status==='Active'?'green':d.status==='Discontinued'?'amber':''}">${esc(d.status)}</span></td><td><button class="btn small" data-action="edit-design" data-id="${d.id}">Edit</button> ${user.role==='Admin'?`<button class="btn small danger" data-action="delete-design" data-id="${d.id}">Delete</button>`:''}</td></tr>`}
function renderInventory(){const batches=allBatches().sort((a,b)=>a.date.localeCompare(b.date));return`${pageHead('Inventory','Unified showroom and warehouse stock, maintained in boxes',`<button class="btn" data-action="stock-out">− Stock out</button><button class="btn primary" data-action="stock-in">＋ Stock in</button>`)}<div class="alert blue">Stock pages show box quantities only. Selling price per box and purchase costs are not displayed here.</div><div class="toolbar" style="margin-bottom:13px"><input class="search" id="stock-search" placeholder="Search design, size or batch…"><select class="search" id="stock-filter"><option value="all">All stock</option><option value="low">Low stock only</option><option value="zero">Zero stock</option></select></div>${panel('Batch-wise stock',batches.length?`<div class="table-wrap"><table><thead><tr><th>Design</th><th>Size</th><th>Batch</th><th>Received date</th><th>Supplier</th><th>Received</th><th>Available</th><th>Status</th></tr></thead><tbody id="stock-rows">${batches.map(b=>{const d=state.designs[b.designId]||{};const lo=availableForDesign(b.designId)<num(d.minStock);return`<tr data-search="${esc((d.name+' '+b.size+' '+b.batchNo+' '+(b.supplier||'')).toLowerCase())}" data-qty="${b.available}" data-low="${lo?1:0}"><td class="strong">${esc(d.name||'Unknown')}</td><td>${esc(b.size||d.size||'')}</td><td>${esc(b.batchNo)}</td><td>${fmtDate(b.date)}</td><td>${esc(b.supplier||'—')}</td><td>${b.received}</td><td><b class="${lo?'red':''}">${b.available}</b></td><td>${b.available>0?'<span class="badge green">Available</span>':'<span class="badge red">Empty</span>'}</td></tr>`}).join('')}</tbody></table></div>`:empty('No inventory batches. Record a stock-in entry to begin.'))}`}
function renderSales(){const ss=allSales().slice().sort((a,b)=>b.ts.localeCompare(a.ts));return`${pageHead('Sales register','Wholesale and retail invoices, GST and non-GST included',`<button class="btn primary" data-action="new-sale">＋ Create sale</button>`)}<div class="grid kpis"><div class="kpi"><div class="kpi-label">WHOLESALE</div><div class="kpi-value">${money(ss.filter(s=>s.accountType==='Dealer').reduce((n,s)=>n+s.total,0))}</div></div><div class="kpi"><div class="kpi-label">RETAIL</div><div class="kpi-value">${money(ss.filter(s=>s.accountType==='Customer').reduce((n,s)=>n+s.total,0))}</div></div><div class="kpi"><div class="kpi-label">INVOICES</div><div class="kpi-value">${ss.length}</div></div><div class="kpi"><div class="kpi-label">GST + NON-GST SALES</div><div class="kpi-value">${money(ss.reduce((n,s)=>n+s.total,0))}</div></div></div><div class="toolbar" style="margin-bottom:13px"><input class="search" id="sales-search" placeholder="Search invoice or account…"><select class="search" id="sales-type"><option value="all">All sales</option><option value="Dealer">Wholesale</option><option value="Customer">Retail</option></select></div>${panel('Invoice history',ss.length?`<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Type</th><th>Account</th><th>Boxes</th><th>GST</th><th>Total</th><th>Received</th><th>Balance</th><th></th></tr></thead><tbody id="sales-rows">${ss.map(s=>saleRow(s)).join('')}</tbody></table></div>`:empty('No sales recorded yet.'))}`}
function saleRow(s){const received=paymentsFor(s.accountType,s.accountId,s.id),balance=s.total-s.returnValue-received;const account=s.accountType==='Dealer'?state.dealers[s.accountId]?.name:state.customers[s.accountId]?.name||s.customerName||'Walk-in';return`<tr data-search="${esc((s.invoiceNo+' '+account).toLowerCase())}" data-type="${s.accountType}"><td class="strong">${esc(s.invoiceNo)}</td><td>${fmtDate(s.date)}</td><td>${s.accountType==='Dealer'?'Wholesale':'Retail'}</td><td>${esc(account||'—')}</td><td>${s.totalBoxes}</td><td>${s.gstEnabled?money(s.gst):'No GST'}</td><td class="strong">${money(s.total)}</td><td>${money(received)}</td><td><span class="badge ${balance>0?'red':'green'}">${money(balance)}</span></td><td><button class="btn small" data-action="view-sale" data-id="${s.id}">View</button> ${user.role==='Admin'?`<button class="btn small danger" data-action="delete-sale" data-id="${s.id}">Delete</button>`:''}</td></tr>`}
function renderAccounts(){const dealers=Object.values(state.dealers),customers=Object.values(state.customers);return`${pageHead('Dealers & customers','Account profiles, opening balances and outstanding ledgers',`<button class="btn" data-action="add-customer">＋ Retail customer</button><button class="btn primary" data-action="add-dealer">＋ Dealer</button>`)}<div class="grid two-col"><div>${panel('Dealer accounts',dealers.length?`<div class="table-wrap"><table><thead><tr><th>Dealer</th><th>Contact</th><th>Phone</th><th>Outstanding</th><th></th></tr></thead><tbody>${dealers.map(d=>`<tr><td class="strong">${esc(d.name)}</td><td>${esc(d.contact||'—')}</td><td>${esc(d.phone||'—')}</td><td><b>${money(outstanding('Dealer',d.id))}</b></td><td><button class="btn small" data-action="dealer-ledger" data-id="${d.id}">Ledger</button></td></tr>`).join('')}</tbody></table></div>`:empty('No dealers added yet.'),`<span class="badge">${dealers.length}</span>` )}</div><div>${panel('Retail customer accounts',customers.length?`<div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Outstanding</th><th></th></tr></thead><tbody>${customers.map(d=>`<tr><td class="strong">${esc(d.name)}</td><td>${esc(d.phone||'—')}</td><td><b>${money(outstanding('Customer',d.id))}</b></td><td><button class="btn small" data-action="customer-ledger" data-id="${d.id}">Ledger</button></td></tr>`).join('')}</tbody></table></div>`:empty('No retail customer accounts yet.'),`<span class="badge">${customers.length}</span>`)}</div></div>`}
function renderPayments(){const ps=state.payments.slice().sort((a,b)=>b.ts.localeCompare(a.ts));return`${pageHead('Payments','Record partial, full, invoice-specific and general account payments',`<button class="btn primary" data-action="add-payment">＋ Record payment</button>`)}<div class="grid kpis"><div class="kpi"><div class="kpi-label">PAYMENTS RECORDED</div><div class="kpi-value">${ps.length}</div></div><div class="kpi"><div class="kpi-label">TOTAL RECEIVED</div><div class="kpi-value">${money(ps.reduce((n,p)=>n+p.amount,0))}</div></div><div class="kpi"><div class="kpi-label">DEALER OUTSTANDING</div><div class="kpi-value">${money(Object.keys(state.dealers).reduce((n,id)=>n+outstanding('Dealer',id),0))}</div></div><div class="kpi"><div class="kpi-label">CUSTOMER OUTSTANDING</div><div class="kpi-value">${money(Object.keys(state.customers).reduce((n,id)=>n+outstanding('Customer',id),0))}</div></div></div>${panel('Payment history',ps.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Account</th><th>Payment type</th><th>Allocation</th><th>Method</th><th>Reference</th><th>Amount</th><th>Recorded by</th></tr></thead><tbody>${ps.map(p=>{const acc=p.accountType==='Dealer'?state.dealers[p.accountId]?.name:state.customers[p.accountId]?.name;return`<tr><td>${fmtDate(p.date)}</td><td class="strong">${esc(acc||'Unknown')}</td><td>${p.accountType}</td><td>${p.invoiceId?'Invoice-specific':'General account'}</td><td>${esc(p.method)}</td><td>${esc(p.reference||'—')}</td><td><b>${money(p.amount)}</b></td><td>${esc(p.user||'')}</td></tr>`}).join('')}</tbody></table></div>`:empty('No payment entries yet.'))}`}
function renderReturns(){return`${pageHead('Customer returns','Only undamaged tiles may be accepted and returned to sellable stock',`<button class="btn primary" data-action="add-return">＋ Record return</button>`)}<div class="alert">Damaged or broken tiles are not accepted as customer returns and must never be added to sellable stock.</div>${panel('Return history',state.returns.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Account</th><th>Design</th><th>Boxes</th><th>Credit</th><th>Reason</th><th>By</th></tr></thead><tbody>${state.returns.slice().reverse().map(r=>{const sale=state.sales[r.saleId];return`<tr><td>${fmtDate(r.date)}</td><td>${esc(sale?.invoiceNo||'')}</td><td>${esc(r.accountName||'')}</td><td>${esc(r.designName||'')}</td><td>${r.qty}</td><td>${money(r.credit)}</td><td>${esc(r.reason||'')}</td><td>${esc(r.userName||'')}</td></tr>`}).join('')}</tbody></table></div>`:empty('No returns have been recorded.'))}`}
function renderDamage(){return`${pageHead('Damaged stock','Record broken or damaged boxes separately from customer returns',`<button class="btn primary" data-action="add-damage">＋ Record damage</button>`)}<div class="grid kpis"><div class="kpi"><div class="kpi-label">DAMAGED BOXES RECORDED</div><div class="kpi-value">${state.damages.reduce((n,d)=>n+num(d.qty),0)}</div></div><div class="kpi"><div class="kpi-label">DAMAGE ENTRIES</div><div class="kpi-value">${state.damages.length}</div></div></div>${panel('Damage report',state.damages.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Design</th><th>Size</th><th>Batch</th><th>Damaged boxes</th><th>Reason</th><th>Recorded by</th></tr></thead><tbody>${state.damages.slice().reverse().map(d=>{const b=state.batches[d.batchId];return`<tr><td>${fmtDate(d.date)}</td><td class="strong">${esc(designLabel(d.designId))}</td><td>${esc(b?.size||'')}</td><td>${esc(b?.batchNo||'')}</td><td><span class="badge red">${d.qty}</span></td><td>${esc(d.reason)}</td><td>${esc(d.userName||'')}</td></tr>`}).join('')}</tbody></table></div>`:empty('No damaged stock entries.'))}`}
function renderReports(){return`${pageHead('Reports & statements','Print or save business reports as PDF into your selected Google Drive folder',`<button class="btn" data-action="backup">Create Drive backup</button>`)}<div class="toolbar" style="margin-bottom:13px"><label class="muted" style="font-size:11px;font-weight:800">Mover analysis period</label><select id="mover-window" class="search" style="min-width:120px"><option value="30">Last 30 days</option><option value="60">Last 60 days</option><option value="90">Last 90 days</option><option value="180">Last 6 months</option><option value="all">All time</option></select><input id="mover-start" class="search" type="date" aria-label="Custom start date"><input id="mover-end" class="search" type="date" aria-label="Custom end date"></div><div class="alert blue">Choose a report below, then use your browser print dialog and select <b>Save as PDF</b>. Save the PDF to the selected Google Drive folder (reports). Stock reports exclude selling price per box and purchase cost.</div><div class="grid three-col">${[['stock','Complete stock report','Design, size, batch and available boxes'],['designstock','Design-wise stock','Total available boxes grouped by design'],['sizestock','Size-wise stock','Total available boxes grouped by tile size'],['batchstock','Batch-wise stock','Available boxes for each batch'],['low','Low-stock report','Designs below configured minimum stock'],['wholesale','Wholesale sales','Dealer invoices and totals'],['retail','Retail sales','Retail invoices and totals'],['combined','Combined sales','Wholesale + retail; GST and non-GST'],['dealer','Dealer statements','Purchases, payments and outstanding'],['customer','Customer outstanding','Retail account balances'],['fast','Fast-moving designs','Actual sold boxes by design'],['slow','Slow-moving designs','Low/no sales with remaining stock'],['damage','Damaged stock','Design, batch, quantity and reason'],['movement','Stock movement history','Stock in/out, sales, re async function restoreBackup(){if(user.role!=='Admin')return toast('Only Administrator can restore backups.',true);const files=[];for await(const [name,h] of dirs.backups.entries()){if(name.endsWith('.json')){try{const d=JSON.parse(await(await h.getFile()).text());if(Array.isArray(d.events))files.push({name,createdAt:d.createdAt||''})}catch(e){}}}files.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(!files.length)return toast('No readable backup snapshots were found.',true);const body=`<div class="alert">Restore adds any event files from the selected snapshot that are missing from the current events folder. It does not erase newer records. Make a fresh backup before restoring.</div><div class="field"><label>Backup snapshot *</label><select name="snapshot" required>${files.map(f=>`<option value="${esc(f.name)}">${esc(f.createdAt)} · ${esc(f.name)}</option>`).join('')}</select></div>`;modal('Restore Drive backup',body,'Restore missing events',async f=>{const name=f.get('snapshot'),raw=await readText(dirs.backups,name),snap=JSON.parse(raw);if(!Array.isArray(snap.events))throw new Error('Selected backup does not contain an event history.');const lock=await acquireLock();try{await refreshState();const existing=new Set(events.map(e=>e.id));let added=0;for(const ev of snap.events){if(!existing.has(ev.id)){const file=`${ev.ts.replace(/[:.]/g,'-')}_${ev.id}.json`;await writeText(dirs.events,file,JSON.stringify(ev,null,2));existing.add(ev.id);added++}}await refreshState();toast(`Restored ${added} missing event(s). Run diagnostics and review stock balances.`)}finally{await releaseLock(lock)}})}
async function resetStaff(){if(user.role!=='Admin')return;const staff=users.find(u=>u.role==='Staff');const body=`<div class="field"><label>New Staff password (minimum 8 characters)</label><input name="pass" type="password" minlength="8" required></div><div class="field"><label>Confirm password</label><input name="confirm" type="password" minlength="8" required></div>`;modal('Reset Staff password',body,'Save new password',async f=>{if(f.get('pass')!==f.get('confirm'))throw new Error('Passwords do not match.');if(String(f.get('pass')).length<8)throw new Error('Use at least 8 characters.');const salt=randomSalt();staff.salt=salt;staff.hash=await derivePass(String(f.get('pass')),salt);await saveUsers(users)})}
async function diagnostics(){const checks=[];try{await permission();checks.push(['Drive folder permission','PASS','Read/write permission granted'])}catch(e){checks.push(['Drive folder permission','FAIL',errText(e)])}const ids=new Set(),dups=[];for(const e of events){if(ids.has(e.id))dups.push(e.id);ids.add(e.id)}checks.push(['Event identifiers',dups.length?'FAIL':'PASS',dups.length+' duplicate event ids']);checks.push(['Event read',events.length?'PASS':'WARN',events.length+' event files loaded']);checks.push(['Account limit',users.length===2?'PASS':'FAIL',users.length+' accounts found; exactly 2 expected']);checks.push(['Staff deletion restriction',users.some(u=>u.role==='Staff')?'PASS':'FAIL','Delete controls are hidden for Staff and delete handlers check Admin role']);checks.push(['FIFO batch allocation',testFifo()?'PASS':'FAIL','3 boxes from oldest batch + 3 from next batch when 6 are sold']);const gross=10*800,itemDiscount=gross*0.05,afterItem=gross-itemDiscount,billDiscount=afterItem*0.10,taxable=afterItem-billDiscount,gst=taxable*0.18,total=taxable+gst;checks.push(['Sq-ft pricing',50*16===800?'PASS':'FAIL','₹50 × 16 sq ft = ₹800 per box']);checks.push(['Discount sequence',Math.abs(total-8071.2)<0.001?'PASS':'FAIL','Item 5% then bill 10% once: taxable ₹6,840; GST ₹1,231.20']);checks.push(['GST / non-GST',Math.abs((taxable+gst)-8071.2)<0.001&&taxable===6840?'PASS':'FAIL','GST invoice total ₹8,071.20; non-GST total ₹6,840']);checks.push(['Dealer balance formula',5000+10000-3000===12000?'PASS':'FAIL','Opening ₹5,000 + purchases ₹10,000 − receipts ₹3,000 = ₹12,000']);checks.push(['Return / damage arithmetic',10-2+1===9?'PASS':'FAIL','10 boxes − 2 damaged + 1 undamaged return = 9 sellable boxes']);checks.push(['Stock conflicts',state.conflicts.length?'FAIL':'PASS',state.conflicts.length+' negative/over-allocated batch conflicts']);try{const name='.diagnostic-'+uid()+'.txt',sample='Shreeji Drive read/write test';await writeText(dirs.config,name,sample);const read=await readText(dirs.config,name);await dirs.config.removeEntry(name);checks.push(['Drive folder read/write',read===sample?'PASS':'FAIL',read===sample?'Temporary test file written, read and removed':'Read-back did not match'])}catch(e){checks.push(['Drive folder read/write','FAIL',errText(e)])}const body=`<div class="alert blue">These are local arithmetic, event and file-permission checks. A successful local check does not prove the other computer has finished syncing. Complete the two-computer test in the setup checklist.</div><table><thead><tr><th>Check</th><th>Result</th><th>Details</th></tr></thead><tbody>${checks.map(c=>`<tr><td>${c[0]}</td><td><span class="badge ${c[1]==='PASS'?'green':c[1]==='FAIL'?'red':'amber'}">${c[1]}</span></td><td>${esc(c[2])}</td></tr>`).join('')}</tbody></table>`;modal('System diagnostics',body,'Close',async()=>{})}
function testFifo(){const a=[{id:'a',date:'2026-01-01',available:3},{id:'b',date:'2026-02-01',available:5}].sort((x,y)=>x.date.localeCompare(y.date));let n=6,out=[];for(const b of a){const q=Math.min(n,b.available);if(q)out.push([b.id,q]);n-=q}return n===0&&out.length===2&&out[0][1]===3&&out[1][1]===3}
// basic navigation event delegation survives page rerenders
$('#root').addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-page]');if(!b)return;if(b.dataset.page){activePage=b.dataset.page;renderPage()}else if(b.dataset.action){const act=b.dataset.action,id=b.dataset.id;const m={'add-design':addDesign,'edit-design':()=>addDesign(id),'delete-design':()=>deleteDesign(id),'stock-in':()=>stockForm('in'),'stock-out':()=>stockForm('out'),'new-sale':newSale,'add-dealer':()=>accountForm('Dealer'),'add-customer':()=>accountForm('Customer'),'add-payment':paymentForm,'add-return':returnForm,'add-damage':damageForm,'report':()=>printReport(id),'backup':backupNow,'reconnect':()=>renderConnect(),'sync':syncAction,'share-folder':shareFolder,'reset-staff':resetStaff,'reset-devices':resetDevices,'restore-backup':restoreBackup,'diagnostics':diagnostics,'view-sale':()=>viewSale(id),'delete-sale':()=>deleteSale(id),'dealer-ledger':()=>printLedger('Dealer',id),'customer-ledger':()=>printLedger('Customer',id)};m[act]?.()}});
// Disable staff deletion even if DOM controls are injected or stale.
window.addEventListener('error',e=>console.error(e.error||e.message));
init();
})();
